<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多益單字卡</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (for speaker icon) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 💡 專業的 CSV 解析套件 (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        /* 隱藏滾動條但保持可滾動 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#fffcf2] min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 1. 語音發音工具 ---
        const playAudio = (text, e) => {
            e.stopPropagation(); 
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        };

        // --- 2. 單一卡片元件 (已依照您的截圖將音標改為紫底紫字，並調整中文粗細) ---
        const WordCard = ({ word }) => {
            return (
                <div className="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)] border border-gray-100 p-6 hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-shadow relative">
                    
                    {/* 絕對定位的單字發音按鈕 (放在右上角) */}
                    <button 
                        onClick={(e) => playAudio(word.word, e)} 
                        className="absolute top-6 right-6 shrink-0 w-11 h-11 rounded-full bg-[#eef2ff] flex items-center justify-center text-[#544ee3] hover:bg-[#e0e7ff] hover:scale-105 transition-all"
                        title="單字發音"
                    >
                        <i className="ph-fill ph-speaker-high text-xl"></i>
                    </button>

                    {/* 1. 單字 */}
                    <h2 className="text-3xl font-bold text-gray-800 mb-3 pr-16">{word.word}</h2>

                    {/* 2. 英文解釋 */}
                    {word.englishDef && (
                        <p className="text-gray-500 text-[1.05rem] leading-relaxed mb-6 pr-16">
                            {word.englishDef}
                        </p>
                    )}

                    {/* 3. 音標與中文解釋 (依照截圖選取區塊：淡紫底標籤 + 無粗體中文) */}
                    <div className="mb-6">
                        {word.phonetic && (
                            <div className="mb-2.5">
                                <span className="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md text-[0.9rem] font-medium tracking-wide border border-indigo-100/50">
                                    {word.phonetic}
                                </span>
                            </div>
                        )}
                        <h3 className="text-[1.15rem] text-gray-700 tracking-wide font-normal">{word.chinese}</h3>
                    </div>
                    
                    {/* 4. 例句與翻譯/搭配詞 */}
                    {(word.sentence || word.translation) && (
                        <div className="bg-[#f3f4f6] rounded-xl p-5 relative group">
                            <div className="pr-12">
                                {word.sentence && <p className="text-gray-700 text-[1.05rem] mb-2 leading-relaxed">{word.sentence}</p>}
                                {word.translation && <p className="text-gray-500 text-[0.95rem] leading-relaxed">{word.translation}</p>}
                            </div>
                            {word.sentence && (
                                <button 
                                    onClick={(e) => playAudio(word.sentence, e)} 
                                    className="absolute right-4 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-transparent border-2 border-gray-300 flex items-center justify-center text-gray-400 hover:text-indigo-500 hover:border-indigo-500 transition-colors"
                                    title="例句發音"
                                >
                                    <i className="ph-fill ph-speaker-high text-lg"></i>
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // --- 3. 主應用程式 ---
        const App = () => {
            const [words, setWords] = useState([]);
            const [units, setUnits] = useState([]);
            const [currentUnit, setCurrentUnit] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            
            // 測驗相關狀態
            const [mode, setMode] = useState('learn');
            const [quizState, setQuizState] = useState('idle');
            const [questions, setQuestions] = useState([]);
            const [currentQIdx, setCurrentQIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);

            useEffect(() => {
                const fetchWords = async () => {
                    try {
                        const pubUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6Cl-MGURu7aJOoO2YcTBZTDX38t2ut41hh7Li3lstnfzGiEicgcm5xb9bXvtg4jj8a6arhxX8AAmh/pub?output=csv';
                        
                        // 💡 終極防護網：多重備用連線策略
                        const urlsToTry = [
                            pubUrl, // 1. 直接讀取 (最快)
                            `https://api.allorigins.win/raw?url=${encodeURIComponent(pubUrl)}`, // 2. 透過 AllOrigins 代理
                            `https://corsproxy.io/?${encodeURIComponent(pubUrl)}` // 3. 透過 corsproxy 代理
                        ];

                        let csvText = null;
                        
                        // 依序嘗試連線，只要一個成功就跳出迴圈
                        for (let url of urlsToTry) {
                            try {
                                const response = await fetch(url);
                                if (response.ok) {
                                    const text = await response.text();
                                    if (!text.trim().toLowerCase().startsWith('<!doctype html>')) {
                                        csvText = text;
                                        break; // 成功讀取到 CSV，跳出迴圈
                                    }
                                }
                            } catch (e) {
                                console.warn(`連線策略失敗，嘗試下一個通道: ${url}`);
                            }
                        }

                        if (!csvText) {
                            throw new Error('所有連線策略皆被阻擋 (Failed to fetch)');
                        }

                        // 使用 PapaParse 處理 CSV 解析
                        Papa.parse(csvText, {
                            skipEmptyLines: true,
                            complete: function(results) {
                                const parsedData = results.data;
                                
                                if (!parsedData || parsedData.length < 2) {
                                    throw new Error('表格內似乎沒有資料');
                                }

                                // 移除標題列並過濾掉空行
                                const dataRows = parsedData.slice(1).filter(row => row[0] && row[1]); 
                                
                                const formattedWords = dataRows.map(row => ({
                                    unit: row[0]?.trim(),        
                                    word: row[1]?.trim(),        
                                    englishDef: row[2]?.trim(),  
                                    phonetic: row[3]?.trim(),    
                                    chinese: row[4]?.trim(),     
                                    sentence: row[5]?.trim(),    
                                    translation: row[6]?.trim()  
                                }));

                                setWords(formattedWords);

                                const uniqueUnits = [...new Set(formattedWords.map(w => w.unit))].filter(Boolean);
                                setUnits(uniqueUnits);
                                if (uniqueUnits.length > 0) {
                                    setCurrentUnit(uniqueUnits[0]);
                                }
                                setIsLoading(false);
                            },
                            error: function(err) {
                                throw new Error('CSV 格式解析失敗: ' + err.message);
                            }
                        });

                    } catch (err) {
                        console.error("除錯日誌:", err);
                        setError(
                            <div className="flex flex-col gap-2">
                                <strong className="block text-xl text-red-700 mb-1">連線錯誤 (Debug 模式) 😥</strong>
                                <p className="text-red-600 font-medium">系統已嘗試了多種安全連線方式，但仍然被阻擋或發生錯誤。</p>
                                <div className="mt-2 text-sm text-red-800 bg-red-100/50 p-4 rounded-lg break-all">
                                    錯誤代碼: {err.message}
                                </div>
                            </div>
                        );
                        setIsLoading(false);
                    }
                };

                fetchWords();
            }, []);

            const currentWords = words.filter(w => w.unit === currentUnit);

            useEffect(() => {
                setQuizState('idle');
            }, [currentUnit]);

            const startQuiz = () => {
                if (currentWords.length < 4) {
                    alert("此單元單字數量不足，無法進行測驗（至少需要4個不同的單字）。");
                    return;
                }
                
                let quizWords = [...currentWords].sort(() => 0.5 - Math.random());
                if (quizWords.length > 10) quizWords = quizWords.slice(0, 10);

                const generatedQuestions = quizWords.map(targetWord => {
                    const getDef = (w) => w.englishDef || w.chinese || "無解釋";
                    const targetDef = getDef(targetWord);

                    let distractors = words.filter(w => getDef(w) !== targetDef);
                    distractors = distractors.sort(() => 0.5 - Math.random()).slice(0, 3);
                    
                    let options = [targetWord, ...distractors].map(w => getDef(w));
                    options = options.sort(() => 0.5 - Math.random()); 

                    return {
                        word: targetWord.word,
                        phonetic: targetWord.phonetic,
                        correctAnswer: targetDef,
                        options: options
                    };
                });

                setQuestions(generatedQuestions);
                setCurrentQIdx(0);
                setScore(0);
                setQuizState('playing');
                setIsAnswered(false);
                setSelectedOption(null);
            };

            const handleOptionClick = (option) => {
                if (isAnswered) return;
                
                setIsAnswered(true);
                setSelectedOption(option);
                
                if (option === questions[currentQIdx].correctAnswer) {
                    setScore(prev => prev + 1);
                }

                setTimeout(() => {
                    if (currentQIdx + 1 < questions.length) {
                        setCurrentQIdx(prev => prev + 1);
                        setIsAnswered(false);
                        setSelectedOption(null);
                    } else {
                        setQuizState('finished');
                    }
                }, 1500);
            };

            return (
                <div>
                    {/* 頂部導覽列 */}
                    <header className="bg-[#f5b800] text-gray-800 pt-8 pb-6 px-6 shadow-sm sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-3">
                                    <i className="ph ph-book-open text-3xl"></i>
                                    多益單字
                                </h1>
                                <p className="text-gray-700 mt-1 text-sm font-medium">目前範圍: {currentUnit}</p>
                            </div>
                            
                            {/* 模式切換按鈕 */}
                            <div className="flex bg-black/5 p-1 rounded-xl self-start md:self-auto backdrop-blur-sm">
                                <button 
                                    onClick={() => { setMode('learn'); setQuizState('idle'); }}
                                    className={`px-6 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all ${mode === 'learn' ? 'bg-white text-[#d97706] shadow-sm' : 'text-gray-700 hover:text-gray-900 hover:bg-black/5'}`}>
                                    <i className="ph ph-book-open-text text-lg"></i>
                                    學習
                                </button>
                                <button 
                                    onClick={() => setMode('quiz')}
                                    className={`px-6 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all ${mode === 'quiz' ? 'bg-white text-[#d97706] shadow-sm' : 'text-gray-700 hover:text-gray-900 hover:bg-black/5'}`}>
                                    <i className="ph ph-brain text-lg"></i>
                                    測驗
                                </button>
                            </div>
                        </div>

                        {/* Unit 分類標籤 */}
                        <div className="max-w-6xl mx-auto mt-6 flex gap-2 overflow-x-auto hide-scrollbar pb-2">
                            {units.map(unit => (
                                <button 
                                    key={unit}
                                    onClick={() => setCurrentUnit(unit)}
                                    className={`whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition-all ${
                                        currentUnit === unit 
                                        ? 'bg-white text-[#d97706] shadow-md' 
                                        : 'bg-black/5 text-gray-800 hover:bg-black/10'
                                    }`}
                                >
                                    {unit}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* 主要內容區 */}
                    <main className="max-w-6xl mx-auto p-6 mt-4">
                        {isLoading && (
                            <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                                <i className="ph ph-spinner-gap animate-spin text-4xl mb-4 text-[#f5b800]"></i>
                                <p>正在從伺服器載入單字，請稍候...</p>
                            </div>
                        )}

                        {error && (
                            <div className="bg-red-50 text-red-600 p-8 rounded-2xl border border-red-100 flex items-start gap-4 shadow-sm max-w-3xl mx-auto mt-8">
                                <i className="ph-fill ph-warning-circle text-4xl mt-1"></i>
                                <div className="flex-1">{error}</div>
                            </div>
                        )}

                        {!isLoading && !error && (
                            <>
                                {mode === 'learn' ? (
                                    <>
                                        <div className="flex items-center gap-3 mb-6 text-gray-600">
                                            <i className="ph ph-grid-four text-xl"></i>
                                            <h2 className="text-xl font-bold">{currentUnit}</h2>
                                            <span className="bg-[#fff4ce] text-[#d97706] px-3 py-1 rounded-full text-xs font-bold ml-auto">
                                                共 {currentWords.length} 個單字
                                            </span>
                                        </div>

                                        {/* 單字卡網格 */}
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-20">
                                            {currentWords.map((word, index) => (
                                                <WordCard key={`${word.word}-${index}`} word={word} />
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    /* 測驗模式 UI */
                                    <div className="max-w-2xl mx-auto bg-white rounded-2xl shadow-[0_2px_15px_rgba(0,0,0,0.05)] border border-gray-100 p-8 pb-12 mt-4 mb-20">
                                        {quizState === 'idle' && (
                                            <div className="text-center py-10">
                                                <div className="w-24 h-24 bg-[#fff4ce] rounded-full flex items-center justify-center mx-auto mb-6">
                                                    <i className="ph-fill ph-brain text-5xl text-[#f5b800]"></i>
                                                </div>
                                                <h2 className="text-2xl font-bold text-gray-800 mb-3">{currentUnit} 單字測驗</h2>
                                                <p className="text-gray-500 mb-8 max-w-sm mx-auto leading-relaxed">
                                                    挑戰一下你的記憶力！系統將從本單元隨機挑選單字，請選出正確的英文解釋。
                                                </p>
                                                <button 
                                                    onClick={startQuiz}
                                                    className="bg-[#f5b800] text-gray-800 px-8 py-3.5 rounded-xl font-bold hover:bg-[#e5ac00] transition-all shadow-lg shadow-[#f5b800]/30 hover:-translate-y-1"
                                                >
                                                    開始測驗
                                                </button>
                                            </div>
                                        )}

                                        {quizState === 'playing' && questions.length > 0 && (
                                            <div className="animate-[fadeIn_0.3s_ease-out]">
                                                <div className="flex justify-between items-center mb-4">
                                                    <span className="text-sm font-bold text-gray-400 tracking-wider">QUESTION {currentQIdx + 1} / {questions.length}</span>
                                                    <span className="bg-[#fff4ce] text-[#d97706] px-3 py-1 rounded-full text-sm font-bold">
                                                        Score: {score}
                                                    </span>
                                                </div>
                                                
                                                {/* 進度條 */}
                                                <div className="w-full bg-gray-100 rounded-full h-2.5 mb-10 overflow-hidden">
                                                    <div 
                                                        className="bg-[#f5b800] h-full rounded-full transition-all duration-500 ease-out" 
                                                        style={{ width: `${((currentQIdx + 1) / questions.length) * 100}%` }}
                                                    ></div>
                                                </div>

                                                <div className="text-center mb-10">
                                                    <h2 className="text-4xl font-bold text-gray-800 mb-3">{questions[currentQIdx].word}</h2>
                                                    {questions[currentQIdx].phonetic && (
                                                        <span className="text-gray-500 font-medium tracking-wide">{questions[currentQIdx].phonetic}</span>
                                                    )}
                                                </div>

                                                <div className="grid grid-cols-1 gap-3.5">
                                                    {questions[currentQIdx].options.map((option, idx) => {
                                                        let btnClass = "border-2 border-gray-100 hover:border-[#f5b800] hover:bg-[#fffcf2] text-gray-700";
                                                        
                                                        if (isAnswered) {
                                                            if (option === questions[currentQIdx].correctAnswer) {
                                                                btnClass = "border-2 border-green-500 bg-green-50 text-green-700";
                                                            } else if (option === selectedOption) {
                                                                btnClass = "border-2 border-red-500 bg-red-50 text-red-700";
                                                            } else {
                                                                btnClass = "border-2 border-gray-50 text-gray-400 bg-gray-50 opacity-60";
                                                            }
                                                        }

                                                        return (
                                                            <button
                                                                key={idx}
                                                                onClick={() => handleOptionClick(option)}
                                                                disabled={isAnswered}
                                                                className={`p-4 rounded-xl text-base leading-snug font-medium transition-all text-left flex items-center justify-between gap-4 ${btnClass}`}
                                                            >
                                                                <span className="flex-1">{option}</span>
                                                                {isAnswered && option === questions[currentQIdx].correctAnswer && (
                                                                    <i className="ph-bold ph-check-circle text-2xl text-green-500 shrink-0"></i>
                                                                )}
                                                                {isAnswered && option === selectedOption && option !== questions[currentQIdx].correctAnswer && (
                                                                    <i className="ph-bold ph-x-circle text-2xl text-red-500 shrink-0"></i>
                                                                )}
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        {quizState === 'finished' && (
                                            <div className="text-center py-10 animate-[fadeIn_0.5s_ease-out]">
                                                <i className="ph-fill ph-trophy text-7xl text-[#f5b800] mb-6 drop-shadow-md"></i>
                                                <h2 className="text-3xl font-bold text-gray-800 mb-2">測驗完成！</h2>
                                                <p className="text-gray-500 mb-8">您在 {currentUnit} 的測驗得分為</p>
                                                
                                                <div className="flex justify-center items-end gap-2 mb-10">
                                                    <span className="text-7xl font-black text-[#f5b800] leading-none">{Math.round((score / questions.length) * 100)}</span>
                                                    <span className="text-2xl text-gray-400 font-bold mb-1.5">分</span>
                                                </div>
                                                
                                                <div className="flex flex-col sm:flex-row justify-center gap-4">
                                                    <button 
                                                        onClick={() => setMode('learn')}
                                                        className="px-6 py-3.5 rounded-xl font-bold border-2 border-gray-200 text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-colors"
                                                    >
                                                        回到學習模式
                                                    </button>
                                                    <button 
                                                        onClick={startQuiz}
                                                        className="bg-[#f5b800] text-gray-800 px-8 py-3.5 rounded-xl font-bold hover:bg-[#e5ac00] transition-colors shadow-lg shadow-[#f5b800]/30"
                                                    >
                                                        重新測驗
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
